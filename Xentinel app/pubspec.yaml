name: xentinel
description: Xentinel - Sistema Inteligente de Control de Acceso (SENA Fontibon).
publish_to: 'none'
version: 1.1.1+4

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  mobile_scanner: 7.4.2
  permission_handler: ^11.3.1
  http: ^1.6.0
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  local_auth: ^2.3.0
  vibration: ^2.0.0
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.0
  connectivity_plus: ^7.3.2
  flutter_secure_storage: ^10.0.0
  screen_brightness: ^2.1.11
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Archivo_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Archivo_800ExtraBold.ttf
          weight: 800
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono_400Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono_500Medium.ttf
          weight: 500
