# Plano de despliegue para Render: API, web y base de datos. Guía completa en DESPLIEGUE.md.
# Los valores con sync: false se escriben en el panel de Render y nunca se guardan aquí.
# Las rutas se escriben desde la raíz del repositorio. Virginia es la región disponible más cercana a Colombia.
databases:
  - name: xentinel-db
    plan: 0.1c-256mb
    region: virginia
    databaseName: xentinel
    # La misma versión mayor de la base local, para poder restaurar su respaldo.
    postgresMajorVersion: "18"

services:
  - type: web
    name: xentinel-api
    runtime: docker
    # Un sistema de emergencias no puede dormirse: el plan gratuito queda descartado.
    plan: 0.5c-512mb
    region: virginia
    dockerfilePath: ./Xentinel web/BackEnd/Dockerfile
    dockerContext: ./Xentinel web/BackEnd
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: ZONA_HORARIA
        value: America/Bogota
      - key: JWT_TTL_SECONDS
        value: "3600"
      - key: DATABASE_URL
        fromDatabase:
          name: xentinel-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: MAIL_ENCRYPTION_KEY
        sync: false
      - key: WEB_ORIGINS
        sync: false
      - key: RESET_PASSWORD_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: xentinel-web
    runtime: static
    buildCommand: cd "Xentinel web/FrontEnd" && npm ci && npm run build
    staticPublishPath: ./Xentinel web/FrontEnd/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
