# Despliegue gratuito para el piloto en Render: API y web. La base de datos vive en Neon.
# Guía completa en DESPLIEGUE.md. Los valores con sync: false se escriben en el panel de
# Render y nunca se guardan aquí. Las rutas se escriben desde la raíz del repositorio.
services:
  - type: web
    name: xentinel-api
    runtime: docker
    # Plan gratis: se duerme tras 15 minutos sin uso y tarda cerca de un minuto en despertar.
    # Antes de atender emergencias reales, cambiar a un plan de pago que no se duerma.
    plan: free
    region: virginia
    dockerfilePath: ./Xentinel web/BackEnd/Dockerfile
    dockerContext: ./Xentinel web/BackEnd
    # /health no consulta la base, para no gastar el cómputo mensual de Neon.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: ZONA_HORARIA
        value: America/Bogota
      - key: JWT_TTL_SECONDS
        value: "3600"
      # El plan gratis bloquea los puertos 465 y 587; el relé de Brevo también atiende el 2525.
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MAIL_ENCRYPTION_KEY
        sync: false
      - key: WEB_ORIGINS
        sync: false
      - key: RESET_PASSWORD_URL
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: xentinel-web
    runtime: static
    buildCommand: cd "Xentinel web/FrontEnd" && npm ci && npm run build
    staticPublishPath: ./Xentinel web/FrontEnd/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
