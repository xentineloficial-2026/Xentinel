# Despliegue gratuito del piloto en Render: API y web. La base de datos vive en Supabase.
# Guía completa en DESPLIEGUE.md. Los valores con sync: false se escriben en el panel de
# Render y nunca se guardan aquí. Las rutas se escriben desde la raíz del repositorio.
services:
  - type: web
    name: xentinel-api
    runtime: docker
    # Plan gratis: se duerme tras 15 minutos sin uso y tarda cerca de un minuto en despertar.
    # Antes de atender emergencias reales, cambiar a un plan de pago que no se duerma.
    plan: free
    # Misma región que la base de Supabase (us-east-1).
    region: virginia
    dockerfilePath: ./Xentinel web/BackEnd/Dockerfile
    dockerContext: ./Xentinel web/BackEnd
    # /health no consulta la base: Render comprueba el proceso sin gastar conexiones.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: ZONA_HORARIA
        value: America/Bogota
      - key: JWT_TTL_SECONDS
        value: "3600"
      # El pooler de Supabase en modo sesión admite 15 conexiones en el plan gratis.
      - key: DB_POOL_MAX
        value: "8"
      # Toda la sede sale por una sola IP pública: el límite de login por IP se eleva y el
      # de cada cuenta (RATE_LIMIT_LOGIN_PER_ACCOUNT) sigue frenando la fuerza bruta.
      - key: RATE_LIMIT_AUTH_PER_15MIN
        value: "300"
      # Código de recuperación de contraseña: 6 dígitos válidos por 15 minutos.
      - key: RESET_TTL_MINUTES
        value: "15"
      # Monitor sísmico (EMSC + USGS) con centro en la sede. En el plan gratis solo
      # vigila mientras el servicio está despierto.
      - key: SEISMIC_ENABLED
        value: "true"
      - key: SEISMIC_LAT
        value: "4.6097"
      - key: SEISMIC_LON
        value: "-74.0817"
      - key: SEISMIC_RADIUS_KM
        value: "500"
      - key: SEISMIC_MIN_MAGNITUDE
        value: "4.0"
      # Correo opcional: sin él la recuperación de contraseña responde 503. El plan gratis
      # bloquea los puertos SMTP 25, 465 y 587: allí se usa Gmail API (GMAIL_CLIENT_ID,
      # GMAIL_CLIENT_SECRET y GMAIL_REFRESH_TOKEN) o un relé con el puerto 2525. Esas
      # credenciales y FIREBASE_SERVICE_ACCOUNT se escriben en el panel (Environment).
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_HOST
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MAIL_ENCRYPTION_KEY
        sync: false
      - key: QR_SECRET
        sync: false
      - key: WEB_ORIGINS
        sync: false
      - key: RESET_PASSWORD_URL
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # Gmail API por HTTPS: los valores viven solo en el panel; sync: false evita que
      # una sincronización del Blueprint los sobrescriba.
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false

  - type: web
    name: xentinel-web
    runtime: static
    buildCommand: cd "Xentinel web/FrontEnd" && npm ci && npm run build
    staticPublishPath: ./Xentinel web/FrontEnd/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
