<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Restablecer contraseña · Xentinel</title>
    <link rel="stylesheet" href="/recuperacion/reset.css" />
    <script src="/recuperacion/reset.js" defer></script>
  </head>
  <body>
    <main>
      <p>XENTINEL · SENA</p>
      <h1>Restablecer contraseña</h1>
      <p id="status" role="status" aria-live="polite">
        Escribe el código de 6 dígitos que recibiste por correo.
      </p>
      <form id="reset-form">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" autocomplete="email" maxlength="254" required />
        <label for="code">Código de 6 dígitos</label>
        <input
          id="code"
          inputmode="numeric"
          autocomplete="one-time-code"
          pattern="[0-9]{6}"
          maxlength="6"
          required
        />
        <label for="password">Nueva contraseña</label>
        <input
          id="password"
          type="password"
          autocomplete="new-password"
          minlength="6"
          maxlength="72"
          required
          aria-describedby="password-help"
        />
        <p id="password-help">Entre 6 caracteres y 72 bytes UTF-8.</p>
        <label for="confirm">Repite la nueva contraseña</label>
        <input
          id="confirm"
          type="password"
          autocomplete="new-password"
          minlength="6"
          maxlength="72"
          required
        />
        <button type="submit">Guardar contraseña</button>
      </form>
    </main>
  </body>
</html>
