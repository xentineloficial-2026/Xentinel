<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Restablecer contraseña · Xentinel</title>
    <link rel="stylesheet" href="/recuperacion/reset.css" />
    <script src="/recuperacion/reset.js" defer></script>
  </head>
  <body>
    <main>
      <p>XENTINEL · SENA</p>
      <h1>Restablecer contraseña</h1>
      <p id="status" role="status" aria-live="polite">Verificando el enlace…</p>
      <form id="reset-form" hidden>
        <label for="password">Nueva contraseña</label>
        <input
          id="password"
          type="password"
          autocomplete="new-password"
          minlength="12"
          maxlength="72"
          required
          aria-describedby="password-help"
        />
        <p id="password-help">Usa al menos 12 caracteres; máximo 72 bytes UTF-8.</p>
        <label for="confirm">Repite la nueva contraseña</label>
        <input
          id="confirm"
          type="password"
          autocomplete="new-password"
          minlength="12"
          maxlength="72"
          required
        />
        <button type="submit">Guardar contraseña</button>
      </form>
    </main>
  </body>
</html>
